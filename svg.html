    <title>SVG Графіка - Аптека «Здоров’я+»</title>

</head>

<body>
    <div class="container">
        <header>
            <h1>Основи SVG: Графічні об'єкти</h1>
            <nav>
                <a href="menu.html">Головне меню</a>
                <a href="author.html">Про автора</a>
                <a href="news.html">Новини</a>
                <a href="pharmacy.html">Про фірму</a>

                <a href="svg.html" class="active">SVG Графіка</a>
                <a href="js.html">JavaScript</a>
                <a href="canvas.html">Canvas</a>
            </nav>
        </header>

        <main>
            <section>
                <h2>Статичне зображення</h2>
                <svg viewBox="-4 -4 10 8" class="svg-canvas" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
                    <desc>Статичний малюнок фігур згідно варіанту.</desc>
                    <defs>
                        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M0,0 L10,5 L0,10 z" />
                        </marker>
                        <symbol id="my-square" viewBox="0 0 1 1">
                            <rect width="1" height="1" />
                        </symbol>
                    </defs>

                    <g transform="scale(1, -1)">
                        <g stroke="black" stroke-width="0.08" fill="none">
                            <line x1="-4" y1="0" x2="6" y2="0" marker-end="url(#arrow)" />
                            <line x1="0" y1="-4" x2="0" y2="3.5" marker-end="url(#arrow)" />
                        </g>

                        <g fill="#0000ff" stroke="black" stroke-width="0.06">
                            <circle cx="-2" cy="1" r="1" />
                            <rect x="-3" y="-1" width="2" height="1" />
                            
                            <circle cx="1" cy="1" r="1" />
                            <rect x="0" y="-1.5" width="1.5" height="1.5" />
                            <rect x="-0.5" y="-3" width="3" height="1" />
                            
                            <g transform="translate(2.5,-1) rotate(45)">
                                <rect x="-0.7" y="-0.7" width="1.4" height="1.4" />
                            </g>

                            <rect x="2" y="1" width="1.5" height="1.5" />
                            <use xlink:href="#my-square" x="3.5" y="-0.25" width="1.25" height="1.25" />
                            <use xlink:href="#my-square" x="3.75" y="-1.5" width="1.25" height="1.25" />
                        </g>
                    </g>
                </svg>
            </section>

            <section>
                <h2>Текст по кривій</h2>
                <svg viewBox="0 0 200 50" class="svg-canvas" xmlns:xlink="http://www.w3.org/1999/xlink">
                    <defs>
                        <path id="text-curve" d="M 10,25 C 50,0 150,50 190,25" />
                    </defs>
                    <text font-family="Verdana" font-size="10">
                        <textPath xlink:href="#text-curve">
                            Аптека «Здоров’я+»
                        </textPath>
                    </text>
                </svg>
            </section>

            <section>
                <h2>Анімоване зображення</h2>
                <svg viewBox="-4 -4 10 8" class="svg-canvas" xmlns:xlink="http://www.w3.org/1999/xlink">
                    <desc>Анімована версія малюнка.</desc>
                    <g transform="scale(1, -1)">
                        <g fill="#0000ff" stroke="black" stroke-width="0.06">
                            
                            <rect x="-3" y="-1" width="2" height="1" />
                            <rect x="0" y="-1.5" width="1.5" height="1.5" />
                            <use xlink:href="#my-square" x="3.5" y="-0.25" width="1.25" height="1.25" />

                            <circle cx="1" cy="1" r="1">
                                <animate attributeName="fill" values="#0000ff;#e76f51;#2a9d8f;#0000ff" dur="6s" repeatCount="indefinite" />
                            </circle>

                            <rect x="2" y="1" width="1.5" height="1.5">
                                <animateTransform attributeName="transform" type="translate" values="0 0; 0.5 0.5; 0 0" keyTimes="0; 0.5; 1" dur="4s" repeatCount="indefinite" />
                            </rect>
                            
                            <g transform="translate(2.5,-1) rotate(45)">
                                <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite" additive="sum" />
                                <rect x="-0.7" y="-0.7" width="1.4" height="1.4" />
                            </g>

                            <circle cx="-2" cy="1" r="1">
                                <animate attributeName="r" values="1; 1.2; 1" dur="3s" repeatCount="indefinite" />
                            </circle>
                            
                            <rect x="-0.5" y="-3" width="3" height="1">
                                <animateTransform attributeName="transform" type="skewX" values="0; 20; 0" dur="4s" repeatCount="indefinite" />
                            </rect>
                            
                            <use xlink:href="#my-square" x="3.75" y="-1.5" width="1.25" height="1.25" />
                        </g>
                    </g>
                </svg>
            </section>
        </main>
    </div>
</body>

</html>
